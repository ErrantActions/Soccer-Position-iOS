name: Simulator validation
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Run unsigned native validation (no signing or upload)
        type: boolean
        required: true
        default: false
      run_simulator_tests:
        description: Execute compact and Duo simulators (disable to compile and run portable core tests only)
        type: boolean
        required: true
        default: true
      upload_app:
        description: Save only the unsigned simulator app for one day (no logs)
        type: boolean
        required: true
        default: false
      toolbar_smoke_check:
        description: Run only the focused native-toolbar UI check and save screenshots for one day
        type: boolean
        required: true
        default: false
      toolbar_check_device:
        description: Device for the focused UI check (compatible does not verify Duo-specific placement)
        type: choice
        required: true
        default: duo
        options: [duo, compatible]
permissions:
  contents: read
concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    if: >-
      inputs.confirm && github.ref == 'refs/heads/main' &&
      github.repository == 'ErrantActions/Soccer-Position-iOS' &&
      github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      BUILD_NUMBER: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release guard tests
        if: ${{ !inputs.toolbar_smoke_check }}
        run: |
          python3 -m unittest discover -s tools/tests
          pwsh -NoProfile -File tools/tests/test-upload-guards.ps1
      - name: Install declared project generator
        run: brew bundle --file Brewfile
      - name: Test positioning, fold layout and pitch coordinates without a simulator
        if: ${{ !inputs.toolbar_smoke_check }}
        run: swift test
      - name: Generate project
        run: bash tools/prepare-ios.sh
      - name: Build and test both simulator sizes
        if: inputs.run_simulator_tests && !inputs.toolbar_smoke_check
        run: bash tools/test-ios.sh
      - name: Compile app and native test bundle without launching a simulator
        if: ${{ !inputs.run_simulator_tests && !inputs.toolbar_smoke_check }}
        run: |
          xcodebuild build-for-testing -project CoachAI.xcodeproj -scheme CoachAI \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=
      - name: Focused native toolbar render check
        if: inputs.toolbar_smoke_check
        env:
          TOOLBAR_CHECK_DEVICE: ${{ inputs.toolbar_check_device }}
        run: python3 tools/check-toolbar.py
      - name: Toolbar screenshots only
        if: always() && inputs.toolbar_smoke_check
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CoachAI-toolbar-screenshots
          path: build/ToolbarScreenshots/**/*.png
          retention-days: 1
          if-no-files-found: warn
      - name: Optional unsigned simulator app
        if: success() && inputs.upload_app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CoachAI-unsigned-simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/CoachAI.app
          retention-days: 1
          if-no-files-found: error
