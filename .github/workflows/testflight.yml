name: TestFlight
on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: Build, sign and upload CoachAI to TestFlight (not an App Store release)
        type: boolean
        required: true
        default: false
      run_simulator_tests:
        description: Run simulator tests before archiving (disable for owner-approved phone testing)
        type: boolean
        required: true
        default: true
      minimum_build_number:
        description: Minimum integer build number; actual number is checked against App Store Connect
        type: string
        required: true
        default: "1"
permissions:
  contents: read
concurrency:
  group: coachai-testflight
  cancel-in-progress: false
jobs:
  upload:
    if: >-
      inputs.confirm_upload && github.ref == 'refs/heads/main' &&
      github.repository == 'ErrantActions/Soccer-Position-iOS' &&
      github.event.repository.private == false
    runs-on: xcode-27
    environment: app-store
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      APP_BUNDLE_ID: com.errantactions.soccerposition
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      MINIMUM_BUILD_NUMBER: ${{ inputs.minimum_build_number }}
      RUN_SIMULATOR_TESTS: ${{ inputs.run_simulator_tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release guard tests
        run: |
          python3 -m unittest discover -s tools/tests
          pwsh -NoProfile -File tools/tests/test-upload-guards.ps1
      - name: Install declared project generator
        run: brew bundle --file Brewfile
      - name: Test tactical rules, AI validation and scene freshness without a simulator
        run: swift test
      - name: Preflight, optional tests, archive, and upload
        env:
          DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: python3 tools/release.py
      - name: Always remove temporary signing material
        if: always()
        run: python3 tools/release.py --cleanup
